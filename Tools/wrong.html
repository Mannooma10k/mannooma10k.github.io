<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصحح الكتابة</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { color: #333; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 18px;
            margin-top: 10px;
            resize: none;
        }
        textarea:focus {
            border-color: #007bff;
            outline: none;
        }
        .result-box {
            margin-top: 20px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            color: #28a745;
            min-height: 30px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>مصحح لوحة المفاتيح المقلوبة</h2>
    <p>اكتب أو الصق النص الإنجليزي (المقصود به عربي) هنا:</p>
    
    <textarea id="englishInput" placeholder="اكتب هنا مثلاً: hpf; []h" oninput="convertToArabic()"></textarea>
    
    <p>النص الصحيح بالعربي:</p>
    <div id="arabicOutput" class="result-box"></div>
</div>

<script>

const map = {
    'q': 'ض', 'w': 'ص', 'e': 'ث', 'r': 'ق', 't': 'ف', 'y': 'غ', 'u': 'ع', 'i': 'ه', 'o': 'خ', 'p': 'ح', '[': 'ج', ']': 'د',
    'a': 'ش', 's': 'س', 'd': 'ي', 'f': 'ب', 'g': 'ل', 'h': 'ا', 'j': 'ت', 'k': 'ن', 'l': 'م', ';': 'ك', "'": 'ط',
    'z': 'ئ', 'x': 'ء', 'c': 'ؤ', 'v': 'ر', 'b': 'لا', 'n': 'ى', 'm': 'ة', ',': 'و', '.': 'ز', '/': 'ظ',
    'Q': 'َ', 'W': 'ً', 'E': 'ُ', 'R': 'ٌ', 'T': 'لإ', 'Y': 'إ', 'U': '`', 'I': '÷', 'O': '×', 'P': '؛', '{': '<', '}': '>',
    'A': 'ِ', 'S': 'ٍ', 'D': ']', 'F': '[', 'G': 'لأ', 'H': 'أ', 'J': 'ـ', 'K': '،', 'L': '/', ':': ':', '"': '"',
    'Z': '~', 'X': 'ْ', 'C': '{', 'V': '}', 'B': 'لآ', 'N': 'آ', 'M': '’', '<': ',', '>': '.', '?': '؟'
};

function convertToArabic() {
    const input = document.getElementById('englishInput').value;
    let output = '';

    for (let i = 0; i < input.length; i++) {
        const char = input[i];
        
        output += map[char] !== undefined ? map[char] : char;
    }

    document.getElementById('arabicOutput').innerText = output;
}
</script>

</body>
</html>
